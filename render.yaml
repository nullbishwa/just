services:
  - type: web
    name: eduflow-signaling-server
    env: node
    plan: free
    region: oregon # or frankfurt / singapore based on your location
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
